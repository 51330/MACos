name: Infinite Web macOS
on: 
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        run: |
          # 1. Download the correct official macOS VS Code CLI zip archive
          curl -Lk 'https://visualstudio.com' --output vscode_cli.zip
          
          # 2. Unpack the zip using macOS native utility
          unzip vscode_cli.zip
          
          # 3. Fire up the direct secure web window
          ./code tunnel --accept-server-license-terms
