name: Infinite Web macOS

on: 
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        run: |
          # 1. Download the actual official VS Code CLI binary archive for macOS
          curl -Lk 'https://code.visualstudio.com/sha/download?build=stable&os=cli-darwin-x64' --output vscode_cli.tar.gz
          
          # 2. Extract the tarball properly
          tar -xzf vscode_cli.tar.gz
          
          # 3. Fire up the secure web tunnel dashboard
          ./code tunnel --accept-server-license-terms
