name: Infinite Web macOS

on: 
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        run: |
          # 1. Download VS Code CLI (or your target CLI zip)
          curl -Lk 'https://code.visualstudio.com/sha/download?build=stable&os=cli-darwin-x64' --output vscode_cli.zip
          
          # 2. Extract cleanly using the macOS unzip utility
          unzip -o vscode_cli.zip
          
          # 3. Fire up the secure web tunnel dashboard
          ./code tunnel --accept-server-license-terms
