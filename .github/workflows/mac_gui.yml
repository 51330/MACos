name: Infinite Web macOS
on: 
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        run: |
          # 1. Download the verified native macOS zip archive 
          curl -Lk 'https://visualstudio.com' --output vscode_cli.zip
          
          # 2. Extract cleanly using the macOS unzip utility
          unzip vscode_cli.zip
          
          # 3. Fire up the secure web workspace tunnel
          ./code tunnel --accept-server-license-terms
