name: Infinite Web macOS

on: 
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            arm64|aarch64)
              vscode_target="cli-darwin-arm64"
              ;;
            x86_64)
              vscode_target="cli-darwin-x64"
              ;;
            *)
              echo "Unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          curl --fail --location --retry 3 \
            "https://update.code.visualstudio.com/latest/${vscode_target}/stable" \
            --output vscode_cli.zip

          unzip -t vscode_cli.zip
          unzip -q vscode_cli.zip

          ./code tunnel --accept-server-license-terms
