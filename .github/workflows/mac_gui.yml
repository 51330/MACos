name: Infinite Web macOS

on: 
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        run: |
          # 1. Download directly from the official update server API for macOS CLI
          curl -fSL "https://update.code.visualstudio.com/latest/cli-darwin-x64/stable" --output vscode_cli.tar.gz
          
          # 2. Extract the tarball package safely
          tar -xzf vscode_cli.tar.gz
          
          # 3. Fire up the secure web tunnel dashboard
          ./code tunnel --accept-server-license-terms
