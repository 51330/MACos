name: Infinite Web macOS
on: 
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        run: |
          # 1. Trick Microsoft's server by pretending to be a real web browser (Mozilla/User-Agent)
          curl -Lk -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" 'https://visualstudio.com' --output vscode_cli.zip
          
          # 2. Extract cleanly using the native unzip utility
          unzip vscode_cli.zip
          
          # 3. Fire up the secure web workspace tunnel
          ./code tunnel --accept-server-license-terms
