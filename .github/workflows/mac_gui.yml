name: Infinite Web macOS

on:
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            arm64|aarch64)
              vscode_target="cli-darwin-arm64"
              ;;
            x86_64)
              vscode_target="cli-darwin-x64"
              ;;
            *)
              echo "Unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          vscode_archive="vscode_cli.tar.gz"
          vscode_url="https://visualstudio.com{vscode_target}/stable"

          echo "Downloading VS Code CLI for $(uname -m)..."
          curl --fail --location --retry 3 --retry-all-errors \
            "${vscode_url}" \
            --output "${vscode_archive}"

          # Validate that the response is a readable gzip tar archive.
          tar -tzf "${vscode_archive}" >/dev/null

          # Extract the CLI. The archive contains the executable named 'code'.
          tar -xzf "${vscode_archive}"

          if [[ ! -x ./code ]]; then
            chmod +x ./code
          fi

          # 1. Install the desktop and VNC server packages using stable methods
          brew install xquartz tigervnc
          pip3 install novnc websockify

          # 2. Configure and run the virtual visual display screen
          Xvfb :1 -screen 0 1280x800x24 &
          export DISPLAY=:1
          
          mkdir -p ~/.vnc
          echo "macospass" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          vncserver :1 -geometry 1280x800 -depth 24

          ./code tunnel --accept-server-license-terms
