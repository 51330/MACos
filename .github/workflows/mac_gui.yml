name: Infinite Web macOS
on: 
  workflow_dispatch:

jobs:
  launch-gui:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Web Browser GUI Session
        run: |
          # 1. Download the verified macOS standalone production binary package
          curl -Lk 'https://visualstudio.com' --output vscode_cli.tar.gz
          
          # 2. Extract cleanly using standard tar commands
          tar -xzf vscode_cli.tar.gz
          
          # 3. Fire up the secure web workspace tunnel
          ./code tunnel --accept-server-license-terms
